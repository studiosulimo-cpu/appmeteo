<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MeteoVicino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#eef3f9; --surface:#ffffff; --ink:#12212f; --dim:#6b7c8c;
    --line:#e4eaf1; --accent:#1f6fe0; --cool:#4a9be0; --warm:#f2a63b;
    --radius:22px; --shadow:0 10px 30px rgba(20,40,70,.08);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Manrope',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:500px; margin:0 auto; padding:0 16px calc(28px + var(--safe-b));}

  /* --- Barra di ricerca (sticky) --- */
  .topbar{
    position:sticky; top:0; z-index:1000; background:var(--bg);
    padding:calc(14px + var(--safe-t)) 0 12px; margin-bottom:4px;
  }
  .brand{font-weight:800; font-size:1.15rem; letter-spacing:-.02em; margin:0 2px 10px}
  .search{display:flex; gap:8px}
  #q{
    flex:1; min-width:0; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); border-radius:14px; padding:13px 15px; font:inherit; font-size:1rem;
    box-shadow:var(--shadow);
  }
  #q::placeholder{color:var(--dim)}
  #q:focus{outline:2px solid var(--accent); outline-offset:0; border-color:transparent}
  .ibtn{
    border:0; background:var(--surface); color:var(--ink); border-radius:14px;
    width:50px; font-size:1.15rem; cursor:pointer; box-shadow:var(--shadow);
  }
  .ibtn.go{background:var(--accent); color:#fff; font-weight:700; font-size:.95rem; width:auto; padding:0 16px}
  .ibtn:active{transform:translateY(1px)}

  .status{color:var(--dim); font-size:.9rem; margin:8px 2px 14px}
  .status.error{color:#b4451f}

  /* --- Risultati ricerca --- */
  .results{display:flex; flex-direction:column; gap:8px; margin-bottom:14px}
  .result{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; cursor:pointer; transition:border-color .12s;
  }
  .result:hover,.result:focus{border-color:var(--accent)}
  .result b{font-weight:700}
  .result span{display:block; font-size:.8rem; color:var(--dim)}

  /* --- Hero meteo attuale (l'elemento forte) --- */
  .hero{
    border-radius:var(--radius); padding:22px 22px 18px; margin-bottom:16px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .hero.c-clear{background:linear-gradient(165deg,#cfe6ff,#eef6ff)}
  .hero.c-cloud{background:linear-gradient(165deg,#dde5ee,#f1f5f9)}
  .hero.c-rain {background:linear-gradient(165deg,#cdd9e6,#e8eef4)}
  .hero.c-snow {background:linear-gradient(165deg,#e4eefb,#f7fbfe)}
  .hero-place{font-size:1.15rem; font-weight:700; letter-spacing:-.01em}
  .hero-cond{color:var(--dim); font-size:.92rem; margin-top:1px}
  .hero-main{display:flex; align-items:center; gap:10px; margin:10px 0 2px}
  .hero-ico{font-size:3.1rem; line-height:1}
  .hero-temp{font-size:4.2rem; font-weight:800; letter-spacing:-.04em; line-height:.95}
  .hero-sub{color:var(--dim); font-size:.9rem; margin-bottom:16px}
  .hero-metrics{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .hero-metrics div{
    background:rgba(255,255,255,.55); border-radius:13px; padding:9px 10px; text-align:center;
  }
  .hero-metrics b{display:block; font-weight:700; font-size:1rem}
  .hero-metrics span{font-size:.72rem; color:var(--dim)}

  /* --- Striscia oraria --- */
  .section-title{font-weight:700; font-size:.95rem; margin:0 2px 8px}
  .hourly{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:18px;
    scrollbar-width:thin; -webkit-overflow-scrolling:touch}
  .hitem{
    flex:0 0 auto; width:60px; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:11px 6px; text-align:center;
  }
  .hitem .ht{font-size:.75rem; color:var(--dim)}
  .hitem .hi{font-size:1.25rem; margin:5px 0}
  .hitem .hv{font-weight:700; font-size:.95rem}

  /* --- Previsione 7 giorni --- */
  .daily{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:6px 16px; margin-bottom:18px; box-shadow:var(--shadow)}
  .drow{display:grid; grid-template-columns:2.4rem 1.5rem 2rem 1fr 2rem; align-items:center;
    gap:10px; padding:11px 0; border-top:1px solid var(--line)}
  .drow:first-child{border-top:0}
  .drow .dow{color:var(--dim); text-transform:capitalize; font-size:.9rem}
  .drow .di{font-size:1.15rem; text-align:center}
  .drow .lo{color:var(--dim); font-weight:600; text-align:right; font-size:.92rem}
  .drow .hi{font-weight:700; text-align:right; font-size:.95rem}
  .drow .bar{height:6px; border-radius:6px; background:var(--line); position:relative}
  .drow .bar i{position:absolute; top:0; height:6px; border-radius:6px;
    background:linear-gradient(90deg,var(--cool),var(--warm))}
  .drow .rain{grid-column:4; justify-self:start; font-size:.68rem; color:var(--accent); margin-top:-6px}

  /* --- Card radar --- */
  .radar-head{display:flex; align-items:center; gap:10px; margin:0 2px 8px}
  .radar-head .section-title{margin:0; flex:1}
  #animBtn{border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:11px; padding:7px 11px; font:inherit; font-size:.82rem; cursor:pointer}
  #animBtn:active{transform:translateY(1px)}
  #animLbl{font-size:.8rem; color:var(--dim); font-variant-numeric:tabular-nums; min-width:38px}
  #map{height:300px; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); background:#dfe6ee}

  footer{color:var(--dim); font-size:.7rem; line-height:1.6; margin-top:16px; padding:0 2px}
  footer a{color:var(--dim)}
  .hidden{display:none}
</style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <h1 class="brand">MeteoVicino</h1>
      <div class="search">
        <input id="q" type="text" inputmode="search" autocomplete="off"
               placeholder="Cerca un comune" aria-label="Cerca un comune" />
        <button id="searchBtn" class="ibtn go" aria-label="Cerca">Cerca</button>
        <button id="locBtn" class="ibtn" aria-label="Usa la mia posizione" title="Usa la mia posizione">📍</button>
      </div>
    </div>

    <p id="status" class="status">Cerca un comune per vedere meteo e radar, o tocca 📍 per usare la tua posizione.</p>
    <div id="results" class="results"></div>

    <section id="hero" class="hero hidden"></section>

    <div id="hourlyWrap" class="hidden">
      <h2 class="section-title">Prossime ore</h2>
      <div id="hourly" class="hourly"></div>
    </div>

    <div id="dailyWrap" class="hidden">
      <h2 class="section-title">Prossimi 7 giorni</h2>
      <div id="daily" class="daily"></div>
    </div>

    <div class="radar-head">
      <h2 class="section-title">Radar</h2>
      <button id="animBtn">▶ Anima ultima ora</button>
      <span id="animLbl"></span>
    </div>
    <div id="map"></div>

    <footer>
      Radar Protezione Civile (Radar-DPC, licenza CC BY-SA). Meteo e previsioni Open-Meteo.
      Mappa base OpenStreetMap.
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    if (typeof L === 'undefined') {
      document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">');
      document.write('<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"><\/script>');
    }
  </script>
  <script>
  if (typeof L === 'undefined') {
    document.getElementById('status').textContent =
      'Leaflet non si è caricato: controlla la connessione, poi ricarica.';
    throw new Error('Leaflet non caricato');
  }

  /* ---------- Mappa + radar DPC ---------- */
  const ITALY=[42.5,12.5], ITALY_BOUNDS=L.latLngBounds([[35,4.4],[48,20.6]]);
  const BLANK='data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
  const map=L.map('map',{zoomControl:true}).setView(ITALY,5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);

  function dpcLayer(p,s){
    return L.tileLayer(
      `https://radar-geowebcache.protezionecivile.it/gwc/service/wmts/rest/radar:${p}/${s}/EPSG:900913/EPSG:900913:{z}/{y}/{x}?format=image/png`,
      {opacity:.65,maxNativeZoom:11,maxZoom:19,tileSize:256,bounds:ITALY_BOUNDS,errorTileUrl:BLANK,
       attribution:'Radar © Protezione Civile (CC BY-SA)'});
  }
  const SRI="Pioggia al suolo (SRI)";
  const dpc={[SRI]:dpcLayer('sri','sri'),"Intensità in quota (VMI)":dpcLayer('vmi','vmi'),
    "Cumulata 1 h":dpcLayer('srt1','srt'),"Cumulata 3 h":dpcLayer('srt3','srt'),"Cumulata 6 h":dpcLayer('srt6','srt')};
  const dpcLayers=Object.values(dpc);
  dpcLayers.forEach(l=>l.on('tileerror',()=>{}));
  dpc[SRI].addTo(map);
  L.control.layers(null,dpc,{collapsed:true}).addTo(map);
  map.on('overlayadd',e=>{ if(dpcLayers.includes(e.layer))
    dpcLayers.forEach(l=>{ if(l!==e.layer&&map.hasLayer(l)) map.removeLayer(l);}); });

  const animLayer=L.tileLayer.wms('https://radar-geowebcache.protezionecivile.it/service/wms',
    {layers:'radar:sri',format:'image/png',transparent:true,version:'1.1.1',opacity:.65,bounds:ITALY_BOUNDS,errorTileUrl:BLANK});
  function frameTimes(n){const step=3e5,lag=6e5,base=Math.floor((Date.now()-lag)/step)*step;
    return Array.from({length:n},(_,i)=>new Date(base-(n-1-i)*step).toISOString());}
  let animTimer=null,frames=[],fi=0;
  const animBtn=document.getElementById('animBtn'),animLbl=document.getElementById('animLbl');
  function stopAnim(){clearInterval(animTimer);animTimer=null;
    if(map.hasLayer(animLayer))map.removeLayer(animLayer);
    if(!map.hasLayer(dpc[SRI]))dpc[SRI].addTo(map);
    animBtn.textContent='▶ Anima ultima ora';animLbl.textContent='';}
  function playAnim(){frames=frameTimes(12);fi=0;
    dpcLayers.forEach(l=>{if(map.hasLayer(l))map.removeLayer(l);});
    animLayer.addTo(map);animBtn.textContent='⏸ Ferma';
    animTimer=setInterval(()=>{const t=frames[fi];animLayer.setParams({time:t});
      animLbl.textContent=new Date(t).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
      fi=(fi+1)%frames.length;},700);}
  animBtn.addEventListener('click',()=>animTimer?stopAnim():playAnim());

  /* ---------- Meteo (Open-Meteo) ---------- */
  const WMO={0:["Sereno","☀️"],1:["Poco nuvoloso","🌤️"],2:["Nubi sparse","⛅"],3:["Coperto","☁️"],
    45:["Nebbia","🌫️"],48:["Nebbia","🌫️"],51:["Pioviggine","🌦️"],53:["Pioviggine","🌦️"],55:["Pioviggine","🌦️"],
    61:["Pioggia debole","🌧️"],63:["Pioggia","🌧️"],65:["Pioggia forte","🌧️"],66:["Pioggia gelata","🌧️"],67:["Pioggia gelata","🌧️"],
    71:["Neve debole","🌨️"],73:["Neve","🌨️"],75:["Neve forte","❄️"],77:["Nevischio","🌨️"],
    80:["Rovesci","🌦️"],81:["Rovesci","🌦️"],82:["Rovesci forti","⛈️"],85:["Rovesci di neve","🌨️"],86:["Rovesci di neve","🌨️"],
    95:["Temporale","⛈️"],96:["Temporale","⛈️"],99:["Temporale","⛈️"]};
  const wmo=c=>WMO[c]||["—","•"];
  const r0=v=>(v==null||v==='')?'–':Math.round(v);
  const status=(m,err)=>{const s=document.getElementById('status');s.textContent=m;s.className='status'+(err?' error':'');};
  function condClass(c){if([0,1].includes(c))return'c-clear';if([2,3,45,48].includes(c))return'c-cloud';
    if([71,73,75,77,85,86].includes(c))return'c-snow';return'c-rain';}
  let marker=null;

  /* ---------- Geocoding: Open-Meteo con riserva OpenStreetMap ---------- */
  async function geocodeOM(name){
    const u=`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=6&language=it&format=json`;
    const d=await (await fetch(u)).json();
    return (d.results||[]).map(r=>({name:r.name,admin1:r.admin1,admin2:r.admin2,country:r.country,cc:r.country_code,lat:r.latitude,lon:r.longitude}));
  }
  async function geocodeOSM(name){
    const u=`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&accept-language=it&q=${encodeURIComponent(name)}`;
    const arr=await (await fetch(u)).json();
    return (arr||[]).map(x=>{const a=x.address||{};
      const nm=a.city||a.town||a.village||a.municipality||a.hamlet||(x.display_name||'').split(',')[0];
      return {name:nm,admin1:a.state,admin2:a.county,country:a.country,cc:(a.country_code||'').toUpperCase(),lat:+x.lat,lon:+x.lon};});
  }
  async function geocode(name){
    const box=document.getElementById('results');
    box.innerHTML=''; status('Cerco “'+name+'”…');
    let res=[],e1=null;
    try{res=await geocodeOM(name);}catch(e){e1=e;}
    if(!res.length){try{res=await geocodeOSM(name);}catch(e2){
      console.error('Geocoding OM:',e1,'| OSM:',e2);
      status('Ricerca non riuscita: '+((e1&&e1.message)||e2.message)+'. Riprova o controlla la connessione.',true);return;}}
    if(!res.length){status('Nessun comune trovato per “'+name+'”. Prova con un centro più grande vicino.');return;}
    status('');
    res.sort((a,b)=>(a.cc==='IT'?-1:0)-(b.cc==='IT'?-1:0));
    box.innerHTML=res.map((r,i)=>{const sub=[r.admin2,r.admin1,r.country].filter(Boolean).join(', ');
      return `<div class="result" tabindex="0" role="button" data-i="${i}"><b>${r.name}</b><span>${sub}</span></div>`;}).join('');
    const pick=el=>{const r=res[+el.dataset.i];box.innerHTML='';document.getElementById('q').blur();
      selectPlace(r.lat,r.lon,`${r.name}${r.admin1?', '+r.admin1:''}`);};
    box.querySelectorAll('.result').forEach(el=>{
      el.addEventListener('click',()=>pick(el));
      el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pick(el);}});});
  }

  function selectPlace(lat,lon,label){
    map.setView([lat,lon],10);
    if(marker)map.removeLayer(marker);
    marker=L.marker([lat,lon]).addTo(map);
    loadForecast(lat,lon,label);
  }

  async function loadForecast(lat,lon,label){
    status('Carico la previsione…');
    try{
      const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
        +`&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m`
        +`&hourly=temperature_2m,weather_code`
        +`&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum`
        +`&timezone=auto&forecast_days=7`;
      const d=await (await fetch(u)).json();
      status('');
      renderHero(d,label); renderHourly(d); renderDaily(d);
    }catch(e){ console.error(e); status('Previsione non disponibile ora. Riprova tra poco.',true); }
  }

  function renderHero(d,label){
    const c=d.current, dl=d.daily, [ctxt,cico]=wmo(c.weather_code);
    const el=document.getElementById('hero');
    el.className='hero '+condClass(c.weather_code);
    el.innerHTML=`
      <div class="hero-place">${label}</div>
      <div class="hero-cond">${ctxt}</div>
      <div class="hero-main"><div class="hero-ico">${cico}</div><div class="hero-temp">${r0(c.temperature_2m)}°</div></div>
      <div class="hero-sub">Percepiti ${r0(c.apparent_temperature)}° · Massima ${r0(dl.temperature_2m_max[0])}° · Minima ${r0(dl.temperature_2m_min[0])}°</div>
      <div class="hero-metrics">
        <div><b>${r0(c.relative_humidity_2m)}%</b><span>Umidità</span></div>
        <div><b>${r0(c.wind_speed_10m)} km/h</b><span>Vento</span></div>
        <div><b>${(c.precipitation??0)} mm</b><span>Pioggia</span></div>
      </div>`;
    el.classList.remove('hidden');
  }

  function renderHourly(d){
    const h=d.hourly, now=d.current.time;
    let s=h.time.findIndex(t=>t>=now); if(s<0)s=0;
    const box=document.getElementById('hourly'); let html='';
    for(let i=s;i<Math.min(s+12,h.time.length);i++){
      const t=h.time[i], lbl=(i===s)?'Adesso':t.slice(11,16), [,ic]=wmo(h.weather_code[i]);
      html+=`<div class="hitem"><div class="ht">${lbl}</div><div class="hi">${ic}</div><div class="hv">${r0(h.temperature_2m[i])}°</div></div>`;
    }
    box.innerHTML=html; document.getElementById('hourlyWrap').classList.remove('hidden');
  }

  function renderDaily(d){
    const dl=d.daily, n=dl.time.length;
    let wMin=Infinity,wMax=-Infinity;
    for(let i=0;i<n;i++){wMin=Math.min(wMin,dl.temperature_2m_min[i]);wMax=Math.max(wMax,dl.temperature_2m_max[i]);}
    const span=Math.max(1,wMax-wMin);
    const box=document.getElementById('daily'); let html='';
    for(let i=0;i<n;i++){
      const dow=i===0?'Oggi':new Date(dl.time[i]).toLocaleDateString('it-IT',{weekday:'short'});
      const [,ic]=wmo(dl.weather_code[i]);
      const lo=dl.temperature_2m_min[i], hi=dl.temperature_2m_max[i], pr=dl.precipitation_sum[i];
      const left=((lo-wMin)/span)*100, width=Math.max(6,((hi-lo)/span)*100);
      html+=`<div class="drow">
        <span class="dow">${dow}</span>
        <span class="di">${ic}</span>
        <span class="lo">${r0(lo)}°</span>
        <span class="bar"><i style="left:${left}%;width:${width}%"></i></span>
        <span class="hi">${r0(hi)}°</span>
        ${pr>0?`<span class="rain">${pr} mm</span>`:''}
      </div>`;
    }
    box.innerHTML=html; document.getElementById('dailyWrap').classList.remove('hidden');
  }

  /* ---------- Eventi ---------- */
  function runSearch(){const v=document.getElementById('q').value.trim(); if(v)geocode(v);}
  document.getElementById('searchBtn').addEventListener('click',runSearch);
  document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch();});
  document.getElementById('locBtn').addEventListener('click',()=>{
    if(!navigator.geolocation){status('Geolocalizzazione non supportata dal browser.');return;}
    status('Individuo la tua posizione…');
    navigator.geolocation.getCurrentPosition(
      p=>selectPlace(p.coords.latitude,p.coords.longitude,'La tua posizione'),
      ()=>status('Non riesco a usare la posizione. Cerca il comune a mano.',true),
      {enableHighAccuracy:false,timeout:8000,maximumAge:300000});
  });
  </script>
</body>
</html>
